[workspace]
resolver = "2"
default-members = ["mslicer"]
# `vendor/rustix` is a patched copy of the crates.io `rustix` 0.37.28 (see
# `[patch.crates-io]` below); keep it out of the workspace so its tests and dev
# dependencies are not pulled into our lockfile.
exclude = ["vendor/rustix", "vendor/egui_tracing"]
members = [
    "common",
    "dist/msla_format",
    "experimental",
    "format/ctb_format",
    "format/goo_format",
    "format/mesh_format",
    "format/nanodlp_format",
    "mslicer",
    "remote_print",
    "slicer",
    "tools"
]

[workspace.dependencies]
common = { path = "common" }
ctb_format = { path = "format/ctb_format" }
experimental = { path = "experimental" }
goo_format = { path = "format/goo_format" }
mesh_format = { path = "format/mesh_format" }
nanodlp_format = { path = "format/nanodlp_format" }
remote_print = { path = "remote_print" }
slicer = { path = "slicer" }
tools = { path = "tools" }

ab_glyph = "0.2.32"
aes = "0.8.4"
afire = "3.0.0-alpha.3"
anyhow = "1.0.99"
bevy = { version = "0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_ui",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_picking",
    "bevy_state",
    "png",
    "default_font",
    "x11",
    "wayland",
] }
bevy_egui = "0.43.1"
bitflags = "2.9.4"
bytemuck = "1.23.2"
cbc = "0.1.2"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
clone-macro = "1.0.0"
concat-idents = "1.1.5"
const_format = "0.2.34"
crc32fast = "1.5.0"
criterion = "0.8.1"
dirs = "6.0.0"
egui = "0.36.2"
egui-phosphor = "0.14.0"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui_extras = { version = "0.36.2", features = ["image"] }
egui_plot = "0.37"
egui_tracing = { path = "vendor/egui_tracing" }
encase = "0.12.0"
epaint_default_fonts = "0.36.2"
gerber_parser = "0.5.0"
hound = "3.5.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
imageproc = "0.25.0"
itertools = "0.14.0"
md5 = "0.8.0"
nalgebra = { version = "0.34.1", features = ["serde-serialize", "encase"] }
notify-rust = "4.11.7"
num-integer = "0.1.46"
num-traits = "0.2.19"
open = "5.3.2"
ordered-float = "5.0.0"
parking_lot = "0.12.4"
poll-promise = { version = "0.3.0", features = ["smol", "smol_tick_poll"] }
rand = "0.10.0"
rayon = "1.11.0"
rfd = { version = "0.16.0", features = ["common-controls-v6"] }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
sha2 = "0.10.9"
soon = { git = "https://github.com/connorslade/misc" }
svg = "0.18.0"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tungstenite = "0.30.0"
ureq = { version = "3.3.0", features = ["multipart"] }
uuid = { version = "1.24.0", features = ["v4"] }
wgpu = "30.0.0"
windows-registry = "0.6.1"
winit = { version = "0.30", default-features = false }
winres = "0.1.12"
zip = "7.2.0"

# In development, only optimize external dependencies and crates that need the
# performance for slicing, generating, or encoding.
[profile.dev]
opt-level = 0
package."*".opt-level = 3 # only applies to external deps
package.ctb_format.opt-level = 3
package.goo_format.opt-level = 3
package.mesh_format.opt-level = 3
package.nanodlp_format.opt-level = 3
package.slicer.opt-level = 3
package.tools.opt-level = 3

# rustix 0.37.28 (pulled in by poll-promise -> smol 1 -> async-io 1) does not
# build on nightly: its build script enables `cfg(rustc_attrs)`, activating
# attributes removed in rust-lang/rust#155433. The vendored copy removes that
# cfg emission. See vendor/rustix/build.rs.
[patch.crates-io]
rustix = { path = "vendor/rustix" }
